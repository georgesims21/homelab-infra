---
# Configuration playbook for laptop - Docker and Jellyfin
# This playbook installs and configures:
#   - Docker CE with docker-compose
#   - Jellyfin media server in a Docker container
#
# Run AFTER laptop-bootstrap.yml has been executed
#
# Usage:
#   # Dry run (check mode)
#   ansible-playbook -i inventory/hosts.yml playbooks/laptop-config.yml --check --diff
#
#   # Apply configuration
#   ansible-playbook -i inventory/hosts.yml playbooks/laptop-config.yml

- name: Configure Laptop - Docker and Jellyfin
  hosts: docker_hosts
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify we're not targeting k3s cluster
      fail:
        msg: "This playbook should ONLY target docker_hosts, not k3s_cluster!"
      when: "'k3s_cluster' in group_names"

  roles:
    - role: geerlingguy.docker
      tags: ['docker']

    - role: jellyfin
      tags: ['jellyfin']
