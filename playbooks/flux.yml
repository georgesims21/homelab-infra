---
- name: Bootstrap FluxCD on K3s
  hosts: k3s_master  # Target your K3s Master node
  become: true
  vars_files:
    - ../inventory/group_vars/k3s_master/vault.yml

  tasks:
    - name: Check if Flux CLI is installed
      command: flux --version
      register: flux_check
      ignore_errors: true
      changed_when: false

    - name: Download and Install Flux CLI
      shell: "curl -s https://fluxcd.io/install.sh | sudo bash"
      when: flux_check.rc != 0

    - name: Check if Flux is already bootstrapped in the cluster
      command: flux check
      register: flux_cluster_check
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      ignore_errors: true
      changed_when: false

    - name: Bootstrap Flux (Connect Cluster to GitHub)
      # This command is safe to run multiple times, but 'when' saves time
      when: flux_cluster_check.rc != 0
      shell: |
        flux bootstrap github \
          --owner={{ flux_github_user }} \
          --repository={{ flux_github_repo }} \
          --branch=main \
          --path={{ flux_cluster_path | default('./clusters/k3s-cluster') }} \
          --personal \
          --components-extra=image-reflector-controller,image-automation-controller
      environment:
        # Pass the token securely as an Environment Variable
        GITHUB_TOKEN: "{{ flux_github_token }}"
        # Tell Flux where to find your K3s config
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
