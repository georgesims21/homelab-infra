---
- name: Install K3s Cluster
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - role: xanmanning.k3s

- name: Configure kubectl access for orchestrator laptop
  hosts: k3s_master
  become: true
  gather_facts: true
  tasks:
    - name: Fetch kubeconfig from k3s master
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /tmp/k3s-kubeconfig-{{ inventory_hostname }}.yaml
        flat: true
      run_once: true

- name: Install kubeconfig on local machine
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Check if kubectl is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/kubectl
      register: kubectl_installed

    - name: Check if k9s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k9s
      register: k9s_installed

    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0755'

    - name: Copy kubeconfig to local machine
      ansible.builtin.copy:
        src: /tmp/k3s-kubeconfig-k3s-master-node-01.yaml
        dest: "{{ ansible_env.HOME }}/.kube/config"
        mode: '0600'

    - name: Update kubeconfig server address
      ansible.builtin.replace:
        path: "{{ ansible_env.HOME }}/.kube/config"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: 'https://{{ hostvars["k3s-master-node-01"]["ansible_host"] }}:6443'

    - name: Get latest k9s release version
      ansible.builtin.uri:
        url: https://api.github.com/repos/derailed/k9s/releases/latest
        return_content: true
      register: k9s_release
      when: not k9s_installed.stat.exists

    - name: Download k9s binary
      ansible.builtin.get_url:
        url: "https://github.com/derailed/k9s/releases/download/{{ k9s_release.json.tag_name }}/k9s_Linux_amd64.tar.gz"
        dest: /tmp/k9s.tar.gz
        mode: '0644'
      when: not k9s_installed.stat.exists

    - name: Extract k9s binary
      ansible.builtin.unarchive:
        src: /tmp/k9s.tar.gz
        dest: /tmp/
        remote_src: true
      when: not k9s_installed.stat.exists

    - name: Install k9s to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/k9s
        dest: /usr/local/bin/k9s
        mode: '0755'
        remote_src: true
      become: true
      when: not k9s_installed.stat.exists

    - name: Clean up k9s installation files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/k9s.tar.gz
        - /tmp/k9s
        - /tmp/README.md
        - /tmp/LICENSE
      when: not k9s_installed.stat.exists

    - name: Create k9s skins directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/k9s/skins"
        state: directory
        mode: '0755'

    - name: Download Gruvbox Dark Hard skin
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/derailed/k9s/master/skins/gruvbox-dark-hard.yaml
        dest: "{{ ansible_env.HOME }}/.config/k9s/skins/gruvbox-dark-hard.yaml"
        mode: '0644'

    - name: Create k9s config directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/k9s"
        state: directory
        mode: '0755'

    - name: Configure k9s to use Gruvbox skin
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.config/k9s/config.yaml"
        create: true
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED - K9S SKIN"
        block: |
          k9s:
            ui:
              skin: gruvbox-dark-hard

    - name: Clean up temporary kubeconfig
      ansible.builtin.file:
        path: /tmp/k3s-kubeconfig-k3s-master-node-01.yaml
        state: absent
