---
# Jellyfin role - Deploys Jellyfin as a Docker container
# This role creates necessary directories and deploys Jellyfin media server

- name: Create Jellyfin user
  ansible.builtin.user:
    name: jellyfin
    shell: /bin/bash
    create_home: true
    state: present

- name: Create Jellyfin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: jellyfin
    group: jellyfin
  loop:
    - "{{ jellyfin_config_dir }}"
    - "{{ jellyfin_cache_dir }}"

- name: Ensure directories are owned by jellyfin user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: yes
    owner: jellyfin
    group: jellyfin
  loop:
    - "{{ jellyfin_config_dir }}"
    - "{{ jellyfin_cache_dir }}"

- name: Ensure media directory exists (if specified)
  ansible.builtin.file:
    path: "{{ jellyfin_media_dir }}"
    state: directory
    mode: '0755'
  when: jellyfin_media_dir is defined

- name: Deploy Jellyfin container
  community.docker.docker_container:
    name: jellyfin
    image: "jellyfin/jellyfin:{{ jellyfin_version }}"
    state: "{{ jellyfin_state }}"
    restart_policy: unless-stopped
    network_mode: host
    user: "{{ jellyfin_uid }}:{{ jellyfin_gid }}"
    env:
      JELLYFIN_PublishedServerUrl: "{{ jellyfin_published_url | default(omit) }}"
    volumes:
      - "{{ jellyfin_config_dir }}:/config:rw,z"
      - "{{ jellyfin_cache_dir }}:/cache:rw,z"
      - "{{ jellyfin_media_dir }}:/movies:ro,z"
    # Note: ports are not needed when using network_mode: host
    # The container directly uses host network stack
    # Volume mount option 'z' sets SELinux context for container access
  when: jellyfin_state != 'absent'

- name: Remove Jellyfin container (if state is absent)
  community.docker.docker_container:
    name: jellyfin
    state: absent
  when: jellyfin_state == 'absent'
