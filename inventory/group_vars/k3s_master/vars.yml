# variables applying to k3s_master group
---
k3s_control_node: true

# --- Control Plane Token ---
k3s_control_token: "{{ k3s_token }}"

# --- The Server Config Dictionary ---
# This maps 1:1 to the keys in /etc/rancher/k3s/config.yaml
k3s_server:
  flannel-backend: 'vxlan'
  write-kubeconfig-mode: "644"
  disable:
    - traefik
    - servicelb
