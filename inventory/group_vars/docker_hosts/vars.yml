---
# Docker installation settings
docker_edition: 'ce'
docker_packages:
  - "docker-{{ docker_edition }}"
  - "docker-{{ docker_edition }}-cli"
  - "containerd.io"
  - docker-buildx-plugin
docker_packages_state: present

# Service options
docker_service_manage: true
docker_service_state: started
docker_service_enabled: true

# Docker Compose Plugin
docker_install_compose_plugin: true
docker_compose_package: docker-compose-plugin
docker_compose_package_state: present

# Docker Compose standalone
docker_install_compose: true
docker_compose_version: "v2.11.1"

# Users to add to docker group
docker_users:
  - ansible

# Docker daemon options (if needed)
docker_daemon_options: {}

# Jellyfin default settings
jellyfin_state: started
jellyfin_config_dir: /opt/jellyfin/config
jellyfin_cache_dir: /opt/jellyfin/cache
jellyfin_media_dir: /media  # Override in host_vars if different
