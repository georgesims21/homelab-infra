# variables applying to k3s_cluster group
---
# --- Role Settings ---
k3s_state: installed
k3s_build_cluster: true
# --- The New "Master IP" Variable ---
k3s_registration_address: 10.0.0.3

# --- User Access --
k3s_kubeconfig_mode: "0644"
k3s_copy_kubeconfig: true
k3s_kubeconfig_dest_file: "~/.k3s/kubeconfig"

k3s_become: true
