---
all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/ansible_id_ed25519
    # Pin the interpreter: silences discovery warnings and keeps it stable if
    # another Python is installed later. Nodes run different Ubuntu LTS releases
    # (python3.12 vs 3.14), and /usr/bin/python3 resolves correctly on each.
    ansible_python_interpreter: /usr/bin/python3

  children:
    # --- Cluster role: what the machine does in k8s ---
    k8s_cluster:
      children:
        k8s_control:
          hosts:
            nucbox: { ansible_host: 10.0.0.2 }
        k8s_worker:
          hosts:
            xps9370: { ansible_host: 10.0.0.3 }
            asusx550c: { ansible_host: 10.0.0.7 }

    # --- Hardware traits: what the machine is ---
    laptops:
      hosts:
        xps9370:
        asusx550c:
