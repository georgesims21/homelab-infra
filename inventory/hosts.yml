---
all:
  children:
    # K3s Cluster - Production server infrastructure
    k3s_cluster:
      vars:
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/ansible_id_ed25519

      children:
        k3s_master:
          hosts:
            k3s-master-node-01:
              ansible_host: 10.0.0.3

        k3s_node:
          hosts: {}
            # k3s-worker-node-01:
            # ansible_host: 10.0.0.5

    # Docker hosts - Standalone servers with Docker only (no k3s)
    docker_hosts:
      vars:
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/ansible_id_ed25519
      
      hosts:
        laptop:
          ansible_host: 10.0.0.4
